<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>1517년, 유럽이 흔들리다</title>
<style>
  :root{--bg:#f3ead6;--ink:#2e281f;--red:#8a2f2f;--gold:#a7803f;--paper:#fbf6e8;--line:#c8b894;--dark:#201d18}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Serif KR","Malgun Gothic",serif;background:radial-gradient(circle at 20% 10%,#fff8e6 0,#efe2c6 40%,#d8c59f 100%);color:var(--ink);min-height:100vh;overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:repeating-linear-gradient(0deg,rgba(80,55,20,.08) 0,rgba(80,55,20,.08) 1px,transparent 1px,transparent 4px)}
  .topbar{position:fixed;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#513b29,#956b34,#513b29);z-index:9}
  main{width:min(980px,92vw);margin:0 auto;padding:54px 0 70px}
  .chapter{font-size:.88rem;letter-spacing:.16em;color:#765f3d;text-align:center;margin-bottom:10px;font-weight:700}
  h1{font-size:clamp(2rem,5vw,4.1rem);text-align:center;line-height:1.1;margin:0;color:#39291d;text-shadow:0 2px #fff5df}
  .year{font-size:clamp(3.8rem,10vw,7.8rem);font-weight:900;text-align:center;line-height:.9;color:var(--red);opacity:.96;margin:18px 0 6px}
  .subtitle{text-align:center;font-size:1.1rem;color:#6d5738;margin-bottom:26px}
  .card{background:rgba(255,250,236,.93);border:1px solid #c5b07e;box-shadow:0 14px 35px rgba(72,50,22,.18),inset 0 0 0 4px rgba(255,255,255,.34);padding:clamp(24px,5vw,44px);border-radius:4px;position:relative}
  .card:before,.card:after{content:"✦";position:absolute;color:#a58a58;font-size:1rem}.card:before{left:14px;top:12px}.card:after{right:14px;bottom:12px}
  .scene-title{font-size:1rem;color:#8a6b3a;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
  .situation{font-size:clamp(1.22rem,2.6vw,1.65rem);line-height:1.75;margin:0 0 18px;font-weight:700}
  .role{border-left:5px solid var(--red);padding:12px 16px;background:#f4ead2;font-size:1.08rem;line-height:1.6;margin:18px 0 26px}
  .choices{display:grid;gap:12px}
  button.choice{appearance:none;border:1px solid #a98f62;background:#fffaf0;color:#30271d;text-align:left;padding:17px 18px;font:inherit;font-size:1rem;line-height:1.45;border-radius:7px;cursor:pointer;transition:.18s transform,.18s background,.18s box-shadow;box-shadow:0 3px 0 #b7a078}
  button.choice:hover{transform:translateY(-2px);background:#fff3d9;box-shadow:0 6px 0 #ab9161}
  button.choice:active{transform:translateY(1px);box-shadow:0 2px 0 #ab9161}
  .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#4c3a29;color:#fff;margin-right:9px;font-weight:800}
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:20px}.bar{height:8px;flex:1;background:#d7c7a7;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#7d2f2c,#a76e34);transition:width .4s ease}.step{font-size:.84rem;color:#796346;font-weight:700}
  .result{display:none;text-align:center}.result.show{display:block;animation:fade .35s ease}.play{display:block}.play.hide{display:none}
  .seal{width:92px;height:92px;margin:0 auto 17px;border:4px double #8f6e3c;border-radius:50%;display:grid;place-items:center;font-size:2.7rem;background:#f3e6c8}
  .result h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:8px 0 14px;color:#5d2c28}.result p{font-size:1.08rem;line-height:1.82;max-width:730px;margin:0 auto 22px}
  .ending{background:#2d241d;color:#f8e9c5;border-color:#5e4937}.ending .result h2{color:#f3d6a3}.ending .seal{background:#422e25;border-color:#c9a66b}.ending p{color:#f2e6d0}
  .success{background:linear-gradient(180deg,#fffaf0,#f4e7c7)}
  .next,.restart{border:0;background:#6f342f;color:white;padding:14px 25px;border-radius:6px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #46231f}
  .next:hover,.restart:hover{filter:brightness(1.08)}
  .tag{display:inline-block;padding:5px 10px;border:1px solid #bca579;background:#f4e8cd;border-radius:99px;font-size:.8rem;margin-bottom:12px;color:#72562f;font-weight:800}
  .final-note{font-size:.9rem!important;color:#745d3d;margin-top:18px!important}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(max-width:600px){main{padding-top:38px}.card{padding:23px 19px}.role{font-size:1rem}.choice{padding:15px 13px!important}}
</style>
</head>
<body>
<div class="topbar"></div>
<main>
  <div class="chapter">HISTORY · RELIGIOUS REFORMATION</div>
  <h1>1517년, 유럽이 흔들리다</h1>
  <div class="year" id="bigYear">1517</div>
  <div class="subtitle" id="subtitle">선택에 따라 역사가 달라집니다.</div>

  <section class="card" id="gameCard">
    <div class="progress"><span class="step" id="stepText">1 / 2</span><div class="bar"><div id="barFill" style="width:50%"></div></div></div>

    <div class="play" id="playArea">
      <div class="scene-title" id="sceneTitle">상황 ① 독일 · 비텐베르크</div>
      <p class="situation" id="situation">교황청은 성 베드로 대성당 건축 재원을 마련하는 과정에서 면벌부 판매를 적극적으로 추진하고 있습니다!</p>
      <div class="role" id="role">“당신은 독일 비텐베르크 대학의 신학 교수 <b>마르틴 루터</b>입니다. 어떤 행동을 하시겠습니까?”</div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="result" id="resultArea">
      <div class="seal" id="seal">☠</div>
      <span class="tag" id="resultTag">ENDING</span>
      <h2 id="resultTitle">엔딩</h2>
      <p id="resultText"></p>
      <button class="restart" id="actionBtn">다시 선택하기</button>
      <p class="final-note" id="finalNote"></p>
    </div>
  </section>
</main>

<script>
const scenes = {
  luther: {
    year:'1517', subtitle:'종교개혁의 불씨가 번지기 시작합니다.', step:'1 / 2', progress:'50%', title:'상황 ① 독일 · 비텐베르크',
    situation:'교황청은 성 베드로 대성당 건축 재원을 마련하는 과정에서 면벌부 판매를 적극적으로 추진하고 있습니다!',
    role:'“당신은 독일 비텐베르크 대학의 신학 교수 <b>마르틴 루터</b>입니다. 어떤 행동을 하시겠습니까?”',
    choices:[
      ['①','교황을 지지하여 힘을 보탠다','bad1'],
      ['②','반박문을 작성하여 성경과 신앙을 중심으로 교회를 개혁하도록 요구한다.','good1'],
      ['③','왕에게 교황을 체포하라고 요구서를 보낸다.','bad3'],
      ['④','모든 종교를 금지시키도록 한다.','bad4']
    ]
  },
  calvin: {
    year:'1530s', subtitle:'종교개혁의 물결이 스위스로 이어집니다.', step:'2 / 2', progress:'100%', title:'상황 ② 스위스 · 제네바',
    situation:'독일에서 시작된 종교개혁의 물결이 스위스에서도 거세지고 있습니다.',
    role:'“당신은 스위스에서 활동하는 종교개혁자 <b>장 칼뱅</b>입니다. 어떤 주장을 펼치시겠습니까?”',
    choices:[
      ['①','인간의 구원이 신에 의해 미리 정해져 있다는 예정설을 주장한다.','final'],
      ['②','무조건 교황의 면벌부 판매 조치에 따라야 한다고 주장한다.','bad5'],
      ['③','그리스 정교로 개종하여 새로운 크리스트교를 열어야 한다고 주장한다.','bad6']
    ]
  }
};

const endings = {
 bad1:{title:'잘못된 선택',text:'당신은 종교개혁을 요구하던 사람들의 거센 비판을 받았습니다. 변화의 흐름을 읽지 못한 채 역사 속에서 영향력을 잃고 말았습니다.',seal:'☠'},
 bad3:{title:'반역의 끝',text:'교황을 체포하라는 과격한 요구는 세속 권력의 지지를 얻지 못했습니다. 당신은 위험한 선동가로 몰려 체포되고 말았습니다.',seal:'⚔'},
 bad4:{title:'고립된 주장',text:'모든 종교를 금지하자는 주장은 누구의 지지도 얻지 못했습니다. 당신은 대학과 사회에서 신뢰를 잃고 자리에서 물러났습니다.',seal:'✕'},
 bad5:{title:'개혁의 흐름에서 밀려나다',text:'교황의 정책을 무조건 따르자는 주장은 개혁을 요구하던 사람들의 반발을 불렀습니다. 당신은 제네바에서 영향력을 잃었습니다.',seal:'↯'},
 bad6:{title:'이단으로 몰리다',text:'당시 서유럽의 종교개혁 흐름과 동떨어진 주장은 지지를 얻지 못했습니다. 가톨릭과 신교 양쪽 모두에게 배척받고 말았습니다.',seal:'🔥'}
};

const el = id=>document.getElementById(id);
let current='luther';
function renderScene(key){
 current=key; const s=scenes[key];
 el('bigYear').textContent=s.year; el('subtitle').textContent=s.subtitle; el('stepText').textContent=s.step; el('barFill').style.width=s.progress;
 el('sceneTitle').textContent=s.title; el('situation').textContent=s.situation; el('role').innerHTML=s.role;
 el('gameCard').className='card'; el('playArea').className='play'; el('resultArea').className='result';
 el('choices').innerHTML='';
 s.choices.forEach(([n,t,outcome])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${n}</span>${t}`;b.onclick=()=>choose(outcome);el('choices').appendChild(b)});
 window.scrollTo({top:0,behavior:'smooth'});
}
function showResult({title,text,seal='✦',tag='ENDING',success=false,button='다시 선택하기',note='',action}){
 el('playArea').className='play hide'; el('resultArea').className='result show'; el('gameCard').className='card '+(success?'success':'ending');
 el('seal').textContent=seal; el('resultTag').textContent=tag; el('resultTitle').textContent=title; el('resultText').innerHTML=text; el('actionBtn').textContent=button; el('finalNote').textContent=note;
 el('actionBtn').onclick=action;
}
function choose(outcome){
 if(outcome==='good1'){
   showResult({title:'종교개혁의 불씨가 번지다!',seal:'📜',tag:'HISTORY CONTINUES',success:true,
   text:'당신의 반박문은 독일 지역의 많은 성직자와 신자들에게 큰 반향을 일으켰습니다. 종교개혁은 점차 확산되었고, <b>1555년 아우크스부르크 화의</b>에서는 독일의 각 제후가 가톨릭과 루터파 가운데 하나를 선택할 수 있게 되었습니다.',
   button:'스위스로 이동하기 →',note:'※ 아우크스부르크 화의는 루터파를 공식적으로 인정한 중요한 계기가 되었습니다.',action:()=>renderScene('calvin')});
 } else if(outcome==='final'){
   el('bigYear').textContent='1648'; el('subtitle').textContent='종교개혁이 유럽의 질서를 바꾸다.';
   showResult({title:'최종 엔딩 · 신교의 확산',seal:'🏰',tag:'MISSION COMPLETE',success:true,
   text:'당신이 주장한 <b>예정설</b>과 엄격한 신앙생활은 여러 지역에 큰 영향을 주었습니다. 칼뱅파는 프랑스·네덜란드·스코틀랜드 등 유럽 여러 지역으로 확산되었습니다.<br><br>종교적 갈등은 이후 국제 정치와 결합하며 <b>30년 전쟁</b>으로 이어졌고, 1648년 <b>베스트팔렌 조약</b>에서 가톨릭·루터파와 함께 칼뱅파도 인정되었습니다. 또한 네덜란드와 스위스의 독립이 국제적으로 승인되었습니다.',
   button:'처음부터 다시 하기',note:'종교개혁 → 신교 확산 → 종교 갈등 → 30년 전쟁 → 베스트팔렌 조약',action:()=>renderScene('luther')});
 } else {
   const e=endings[outcome];
   showResult({...e,tag:'ENDING',button:'다시 선택하기',note:'다른 선택을 해 역사를 계속 진행해 보세요.',action:()=>renderScene(current)});
 }
}
renderScene('luther');
</script>
</body>
</html>
