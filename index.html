<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>근대 세계 체험 게임 · 종교개혁과 재정 군사 국가</title>
<style>
  :root{--bg:#f3ead6;--ink:#2e281f;--red:#8a2f2f;--gold:#a7803f;--paper:#fbf6e8;--line:#c8b894;--dark:#201d18}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Serif KR","Malgun Gothic",serif;background:radial-gradient(circle at 20% 10%,#fff8e6 0,#efe2c6 40%,#d8c59f 100%);color:var(--ink);min-height:100vh;overflow-x:hidden}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:repeating-linear-gradient(0deg,rgba(80,55,20,.08) 0,rgba(80,55,20,.08) 1px,transparent 1px,transparent 4px)}
  .topbar{position:fixed;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#513b29,#956b34,#513b29);z-index:9}
  main{width:min(980px,92vw);margin:0 auto;padding:54px 0 70px}
  .chapter{font-size:.88rem;letter-spacing:.16em;color:#765f3d;text-align:center;margin-bottom:10px;font-weight:700}
  h1{font-size:clamp(2rem,5vw,4.1rem);text-align:center;line-height:1.1;margin:0;color:#39291d;text-shadow:0 2px #fff5df}
  .year{font-size:clamp(3.8rem,10vw,7.8rem);font-weight:900;text-align:center;line-height:.9;color:var(--red);opacity:.96;margin:18px 0 6px}
  .subtitle{text-align:center;font-size:1.1rem;color:#6d5738;margin-bottom:26px}
  .card{background:rgba(255,250,236,.93);border:1px solid #c5b07e;box-shadow:0 14px 35px rgba(72,50,22,.18),inset 0 0 0 4px rgba(255,255,255,.34);padding:clamp(24px,5vw,44px);border-radius:4px;position:relative}
  .card:before,.card:after{content:"✦";position:absolute;color:#a58a58;font-size:1rem}.card:before{left:14px;top:12px}.card:after{right:14px;bottom:12px}
  .scene-title{font-size:1rem;color:#8a6b3a;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
  .scene-image,.result-image{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center;border:1px solid #9d8052;border-radius:7px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),0 8px 20px rgba(65,43,19,.18);margin:2px 0 22px;filter:saturate(.95) contrast(1.03);display:block}
  .result-image{max-width:900px;margin:4px auto 22px}
  @media(min-width:1100px){.scene-image,.result-image{image-rendering:auto}}
  .situation{font-size:clamp(1.22rem,2.6vw,1.65rem);line-height:1.75;margin:0 0 18px;font-weight:700}
  .role{border-left:5px solid var(--red);padding:12px 16px;background:#f4ead2;font-size:1.08rem;line-height:1.6;margin:18px 0 26px}
  .choices{display:grid;gap:12px}
  button.choice{appearance:none;border:1px solid #a98f62;background:#fffaf0;color:#30271d;text-align:left;padding:17px 18px;font:inherit;font-size:1rem;line-height:1.45;border-radius:7px;cursor:pointer;transition:.18s transform,.18s background,.18s box-shadow;box-shadow:0 3px 0 #b7a078}
  button.choice:hover{transform:translateY(-2px);background:#fff3d9;box-shadow:0 6px 0 #ab9161}
  button.choice:active{transform:translateY(1px);box-shadow:0 2px 0 #ab9161}
  .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#4c3a29;color:#fff;margin-right:9px;font-weight:800}
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:20px}.bar{height:8px;flex:1;background:#d7c7a7;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#7d2f2c,#a76e34);transition:width .4s ease}.step{font-size:.84rem;color:#796346;font-weight:700}
  .result{display:none;text-align:center}.result.show{display:block;animation:fade .35s ease}.play{display:block}.play.hide{display:none}
  .seal{width:92px;height:92px;margin:0 auto 17px;border:4px double #8f6e3c;border-radius:50%;display:grid;place-items:center;font-size:2.7rem;background:#f3e6c8}
  .result h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:8px 0 14px;color:#5d2c28}.result p{font-size:1.08rem;line-height:1.82;max-width:730px;margin:0 auto 22px}
  .ending{background:#2d241d;color:#f8e9c5;border-color:#5e4937}.ending .result h2{color:#f3d6a3}.ending .seal{background:#422e25;border-color:#c9a66b}.ending p{color:#f2e6d0}
  .success{background:linear-gradient(180deg,#fffaf0,#f4e7c7)}
  .next,.restart{border:0;background:#6f342f;color:white;padding:14px 25px;border-radius:6px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #46231f}
  .next:hover,.restart:hover{filter:brightness(1.08)}
  .tag{display:inline-block;padding:5px 10px;border:1px solid #bca579;background:#f4e8cd;border-radius:99px;font-size:.8rem;margin-bottom:12px;color:#72562f;font-weight:800}
  .final-note{font-size:.9rem!important;color:#745d3d;margin-top:18px!important}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media(max-width:600px){main{padding-top:38px}.card{padding:23px 19px}.role{font-size:1rem}.choice{padding:15px 13px!important}}

  .stats{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px}
  .stats.show{display:grid}
  .stat{background:#2f281f;color:#f6ead0;border:1px solid #8f7042;border-radius:7px;padding:12px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.04)}
  .stat .icon{font-size:1.25rem}.stat .label{font-size:.78rem;opacity:.8;margin-top:2px}.stat .value{font-size:1.45rem;font-weight:900;margin-top:2px;color:#f4d398}
  .stat.flash{animation:statflash .45s ease}
  .delta{font-weight:900;margin-left:8px}.plus{color:#246b36}.minus{color:#a4302e}
  .event-banner{border:1px solid #9a7746;background:linear-gradient(135deg,#382a1f,#5a3a24);color:#f6e5bc;border-radius:7px;padding:18px 20px;margin:2px 0 18px;box-shadow:0 8px 20px rgba(48,31,17,.18)}
  .event-banner b{color:#ffd58c}.event-banner .eyebrow{font-size:.76rem;letter-spacing:.15em;color:#d4b278;font-weight:900;margin-bottom:6px}
  
  .chapter-break{font-size:1.15rem;color:#6d5738;text-align:center;margin:0 0 16px;font-weight:800}
  .history-tip{margin:18px 0 0;border-top:1px dashed #b9a47d;padding-top:13px;color:#765f42;font-size:.9rem;line-height:1.65}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#2f281f;color:#f6ead0;border:1px solid #a7803f;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25)} .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes statflash{0%{transform:scale(1)}45%{transform:scale(1.07);background:#554124}100%{transform:scale(1)}}
  @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}

</style>

<style id="v10-no-illustrations">
#sceneImage, #resultImage {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
  min-height: 0 !important;
  max-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  opacity: 0 !important;
  overflow: hidden !important;
}
</style>


<style id="v11-remove-image-boxes">
/* v11: illustrations and their reserved layout space are completely removed */
#sceneImage,
#resultImage {
  display: none !important;
}

/* Collapse wrappers that contain only the hidden illustration. */
.scene-visual,
.result-visual,
.scene-media,
.result-media,
.image-wrap,
.image-wrapper,
.illustration-wrap,
.illustration-wrapper,
.scene-image-wrap,
.result-image-wrap {
  display: none !important;
  height: 0 !important;
  min-height: 0 !important;
  max-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  overflow: hidden !important;
}

/* In this game the illustration classes themselves previously reserve aspect-ratio/height.
   Remove that reserved box explicitly. */
.scene-image,
.result-image {
  display: none !important;
  height: 0 !important;
  min-height: 0 !important;
  max-height: 0 !important;
  aspect-ratio: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
}

/* Modern browsers: hide any parent figure/picture whose only media is our hidden game image. */
figure:has(#sceneImage),
figure:has(#resultImage),
picture:has(#sceneImage),
picture:has(#resultImage) {
  display: none !important;
  height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
}
</style>


<style id="v12-true-text-only">
#sceneImage, #resultImage, #warVisual, .war-visual {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
  min-height: 0 !important;
  max-height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
}
</style>

  display:none;

  display:block;

#legacyGamePage { display:block; }
#chapter3 { display:none; }
#chapter3.active {
  display:block !important;
  max-width: 980px;
  margin: 0 auto;
  padding: 28px 34px 50px;
}

  display:none !important;
}

  display:block !important;

</head>
<body>
<div id="legacyGamePage">

<div class="topbar"></div><div class="toast" id="toast">선택 결과가 국가 수치에 반영되었습니다.</div>
<main>
  <div class="chapter">HISTORY · RELIGIOUS REFORMATION</div>
  <h1 id="gameTitle">1517년, 유럽이 흔들리다</h1>
  <div class="year" id="bigYear">1517</div>
  <div class="subtitle" id="subtitle">선택에 따라 역사가 달라집니다.</div>

  <section class="card" id="gameCard">
    <div class="stats" id="statsBar">
      <div class="stat" data-stat="gold"><div class="icon">💰</div><div class="label">금</div><div class="value" id="goldValue">100</div></div>
      <div class="stat" data-stat="pop"><div class="icon">👥</div><div class="label">인구</div><div class="value" id="popValue">100</div></div>
      <div class="stat" data-stat="army"><div class="icon">⚔️</div><div class="label">상비군</div><div class="value" id="armyValue">30</div></div>
      <div class="stat" data-stat="crown"><div class="icon">👑</div><div class="label">왕권</div><div class="value" id="crownValue">50</div></div>
    </div>
    <div class="progress"><span class="step" id="stepText">1 / 2</span><div class="bar"><div id="barFill" style="width:50%"></div></div></div>

    <div class="play" id="playArea">
      <div class="scene-title" id="sceneTitle">상황 ① 독일 · 비텐베르크</div>
      <img  class="scene-image" id="sceneImage" src="assets/luther_scene.jpg" alt="종교개혁 상황 삽화" aria-hidden="true">
      <p class="situation" id="situation">교황청은 성 베드로 대성당 건축 재원을 마련하는 과정에서 면벌부 판매를 적극적으로 추진하고 있습니다!</p>
      <div class="role" id="role">“당신은 독일 비텐베르크 대학의 신학 교수 <b>마르틴 루터</b>입니다. 어떤 행동을 하시겠습니까?”</div>
      <div class="choices" id="choices"></div>
    </div>

    <div class="result" id="resultArea">
      <div class="seal" id="seal">☠</div>
      <img  class="result-image" id="resultImage" src="assets/luther_bad1.jpg" alt="선택 결과 삽화" aria-hidden="true">
      <span class="tag" id="resultTag">ENDING</span>
      <h2 id="resultTitle">엔딩</h2>
      <p id="resultText"></p>
      <button class="restart" id="actionBtn">다시 선택하기</button>
      <p class="final-note" id="finalNote"></p>
    </div>
  </section>
</main>

<script>
const scenes = {
  luther: {
    year:'1517', subtitle:'종교개혁의 불씨가 번지기 시작합니다.', step:'1 / 2', progress:'50%', title:'상황 ① 독일 · 비텐베르크',
    situation:'교황이 새로운 성당 건축을 위해 면벌부 구입을 강요하고 있습니다!',
    image:'assets/luther_scene.jpg',
    role:'“당신은 독일 비텐베르크 대학의 신학 교수 <b>마르틴 루터</b>입니다. 어떤 행동을 하시겠습니까?”',
    choices:[
      ['①','교황을 지지하여 힘을 보탠다','bad1'],
      ['②','반박문을 작성하여 성경과 신앙을 중심으로 교회를 개혁하도록 요구한다.','good1'],
      ['③','왕에게 교황을 체포하라고 요구서를 보낸다.','bad3'],
      ['④','모든 종교를 금지시키도록 한다.','bad4']
    ]
  },
  calvin: {
    year:'1530s', subtitle:'종교개혁의 물결이 스위스로 이어집니다.', step:'2 / 2', progress:'100%', title:'상황 ② 스위스 · 제네바',
    situation:'스위스에서도 종교 개혁의 물결이 계속됩니다.',
    image:'assets/calvin_scene.jpg',
    role:'“당신은 스위스에서 활동하는 종교개혁자 <b>장 칼뱅</b>입니다. 어떤 주장을 펼치시겠습니까?”',
    choices:[
      ['①','인간의 구원이 신에 의해 미리 정해져 있다는 예정설을 주장한다.','final'],
      ['②','무조건 교황의 면벌부 판매 조치에 따라야 한다고 주장한다.','bad5'],
      ['③','그리스 정교로 개종하여 새로운 크리스트교를 열어야 한다고 주장한다.','bad6']
    ]
  }
};

const endings = {
 bad1:{title:'비극적인 엔딩',text:'당신은 성난 민중들이 휘두른 몽둥이에 숨졌습니다. 모두 당신의 경멸스러운 이름을 기억할 것입니다.',seal:'☠',image:'assets/luther_bad1.jpg'},
 bad3:{title:'반역죄 엔딩',text:'왕이 당신의 요구서를 보고 반역죄로 체포하였습니다. 당신은 <b>화형</b>으로 생을 마감했습니다.',seal:'🔥',image:'assets/luther_bad3.jpg'},
 bad4:{title:'대학에서 쫓겨나다',text:'모든 민중이 당신의 주장을 미친 소리 취급했고, 당신은 대학 교수 자리에서 물러나야 했습니다.',seal:'✕',image:'assets/luther_bad4.jpg'},
 bad5:{title:'스위스에서 추방되다',text:'성난 민심이 당신을 위협합니다. 당신은 스위스에서 쫓겨나게 되었습니다.',seal:'↯',image:'assets/calvin_bad5.jpg'},
 bad6:{title:'이단으로 지목되다',text:'당신은 교황청에서 이단으로 지목되어 <b>화형</b>되었습니다.',seal:'🔥',image:'assets/calvin_bad6.jpg'}
};

const el = id=>document.getElementById(id);
let current='luther';
function renderScene(key){
 current=key; const s=scenes[key];
 el('statsBar').classList.remove('show'); document.querySelector('.chapter').textContent='HISTORY · RELIGIOUS REFORMATION'; el('gameTitle').textContent='1517년, 유럽이 흔들리다'; el('sceneImage').style.display=''; let w=document.getElementById('warVisual'); if(w)w.remove();
 el('bigYear').textContent=s.year; el('subtitle').textContent=s.subtitle; el('stepText').textContent=s.step; el('barFill').style.width=s.progress;
 el('sceneTitle').textContent=s.title; el('sceneImage').src=s.image; el('situation').textContent=s.situation; el('role').innerHTML=s.role;
 el('gameCard').className='card'; el('playArea').className='play'; el('resultArea').className='result';
 el('choices').innerHTML='';
 s.choices.forEach(([n,t,outcome])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${n}</span>${t}`;b.onclick=()=>choose(outcome);el('choices').appendChild(b)});
 window.scrollTo({top:0,behavior:'smooth'});
}
function showResult({title,text,seal='✦',tag='ENDING',success=false,button='다시 선택하기',note='',image='assets/luther_bad1.jpg',action}){
 el('playArea').className='play hide'; el('resultArea').className='result show'; el('gameCard').className='card '+(success?'success':'ending');
 el('seal').textContent=seal; el('resultImage').src=image; el('resultTag').textContent=tag; el('resultTitle').textContent=title; el('resultText').innerHTML=text; el('actionBtn').textContent=button; el('finalNote').textContent=note;
 el('actionBtn').onclick=action;
}
function choose(outcome){
 if(outcome==='good1'){
   showResult({title:'종교개혁의 불씨가 번지다!',seal:'📜',tag:'HISTORY CONTINUES',success:true,
   text:'독일 지역의 많은 성직자들과 교인들이 당신의 반박문에 화답했습니다! 결국 <b>1555년 아우크스부르크 화의</b>가 체결되어 루터파가 공식적으로 인정받았습니다.',
   image:'assets/luther_good1.jpg',
   button:'스위스로 이동하기 →',note:'※ 아우크스부르크 화의는 루터파를 공식적으로 인정한 중요한 계기가 되었습니다.',action:()=>renderScene('calvin')});
 } else if(outcome==='final'){
   el('bigYear').textContent='1648'; el('subtitle').textContent='종교개혁이 유럽의 질서를 바꾸다.';
   showResult({title:'최종 엔딩 · 신교의 확산',seal:'🏰',tag:'MISSION COMPLETE',success:true,

let stats={gold:100,pop:100,army:30,crown:50};
function resetStats(){stats={gold:100,pop:100,army:30,crown:50};updateStats();}
function updateStats(changed=[]){
  el('goldValue').textContent=stats.gold; el('popValue').textContent=stats.pop; el('armyValue').textContent=stats.army; el('crownValue').textContent=stats.crown;
  changed.forEach(k=>{const box=document.querySelector(`[data-stat="${k}"]`); if(box){box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');}})
}
function changeStats(delta){const ch=[]; Object.entries(delta).forEach(([k,v])=>{stats[k]+=v;ch.push(k)});updateStats(ch); const t=el('toast'); t.classList.add('show'); clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),1100)}
function fiscalFrame(step,title,situation,role,choices,image='assets/fiscal_army.jpg'){
  current='fiscal';
  el('statsBar').classList.add('show');
  el('bigYear').textContent='17세기'; el('subtitle').textContent='재정 군사 국가 체험하기';
  document.querySelector('.chapter').textContent='HISTORY · FISCAL-MILITARY STATE'; el('gameTitle').textContent='재정 군사 국가 체험하기';
  el('stepText').textContent=step+' / 4'; el('barFill').style.width=(step*25)+'%';
  el('sceneTitle').textContent=title; el('situation').innerHTML=situation; el('role').innerHTML=role;
  el('sceneImage').style.display='none';
  let old=document.getElementById('warVisual'); if(old) old.remove();
  el('gameCard').className='card'; el('playArea').className='play'; el('resultArea').className='result';
  el('choices').innerHTML='';
  choices.forEach(([n,t,fn])=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${n}</span>${t}`;b.onclick=fn;el('choices').appendChild(b)});
  window.scrollTo({top:0,behavior:'smooth'});
}
function startFiscal(){
  resetStats();
  fiscalFrame(1,'이벤트 ① 전쟁의 그림자','주변 국가가 <b>상비군을 확대</b>하여 전쟁을 준비하고 있습니다!','당신은 한 근대 유럽 국가의 통치자입니다. 국가를 지키기 위해 어떤 선택을 하시겠습니까?',[['A','상비군 확대',()=>{changeStats({gold:-30,army:+30});fiscalTax()}],['B','상비군 유지',()=>fiscalDefeatMaintain()]],'assets/fiscal_army.jpg');
}
function fiscalDefeatMaintain(){
  changeStats({crown:-20,pop:-20});
  fiscalEnding(false,'국가 멸망','전쟁 발발!','상대국의 대규모 상비군을 막아내지 못했습니다. 전쟁에서 패배하며 왕권과 인구가 크게 감소했습니다. 국가는 결국 멸망했습니다.','☠');
}
function fiscalTax(){
  fiscalFrame(2,'이벤트 ② 상비군의 비용','전쟁이 시작되었습니다. 당신의 상비군은 적의 공격을 막아냈습니다!<br><br>그러나 <b>대규모 상비군을 유지하려면 지속적인 세금이 필요합니다!</b>','어떻게 재정을 마련하시겠습니까?',[['A','의회와 협력하여 세금 확보',()=>fiscalRevenue('parliament')],['B','왕이 직접 세금 징수',()=>{changeStats({crown:+20});fiscalRevenue('king')}],['C','군대 축소',()=>{changeStats({army:-30,crown:-50,pop:-50});fiscalEnding(false,'전쟁 패배 · 국가 멸망','군대를 줄인 직후 적군이 다시 공격했습니다!','상비군이 줄어든 틈을 타 적군이 침공했습니다. 상비군과 왕권, 인구가 크게 감소했습니다. 국가는 전쟁에서 패배하고 멸망했습니다.','⚔️','assets/fiscal_defeat.jpg')}]],'assets/fiscal_tax.jpg');
}
function fiscalRevenue(method){
  fiscalFrame(3,'이벤트 ③ 세입의 한계','세금을 마련하려 했지만 <b>국고에 들어올 세원이 충분하지 않아 징수가 어렵습니다.</b>','상비군을 유지할 새로운 재정 기반이 필요합니다. 어떤 경제 정책을 선택하시겠습니까?',[['①','중상주의 정책 채택',()=>fiscalMercantilism()],['②','중상주의 정책 채택하지 않음',()=>{changeStats({gold:-50,army:-30});fiscalEnding(false,'국가 멸망','재정이 바닥나다','충분한 재정을 확보하지 못해 상비군을 유지할 수 없게 되었습니다. 국고와 상비군이 크게 줄었습니다. 적국의 공격을 막지 못하고 국가가 멸망했습니다.','📉','assets/fiscal_collapse.jpg')}]],'assets/fiscal_treasury.jpg');
}
function fiscalMercantilism(){
  fiscalFrame(4,'최종 선택 · 중상주의 정책','국가가 <b>중상주의 정책</b>을 채택하기로 했습니다. 이제 구체적인 정책을 결정해야 합니다.','국부를 늘리고 상비군을 유지하기 위해 어떤 정책을 시행하시겠습니까?',[['⑴','원료 수출 금지, 완성품 수입 금지 조치 내리기',()=>{changeStats({gold:+50,army:+30});fiscalEnding(true,'전쟁 승리!','재정 군사 국가의 성장','전쟁에서 승리했습니다. 당신의 국가는 태평성대를 누리며 최고의 국가로 성장해나갔습니다!','🏆','assets/fiscal_victory.jpg')}],['⑵','식민지보다는 국내에 머무르기',()=>{changeStats({gold:-50,army:-30});fiscalEnding(false,'전쟁 패배!','국가 멸망','중상주의 경쟁에서 뒤처지며 재정이 약화되었습니다. 국고와 상비군이 크게 줄었습니다. 결국 전쟁에서 패배했습니다.','☠')}],['⑶','국내 공업 제품의 출국세 높이기',()=>{changeStats({gold:-50,army:-30});fiscalEnding(false,'전쟁 패배!','국가 멸망','공업 제품의 해외 판매가 위축되어 재정이 악화되었습니다. 국고와 상비군이 크게 줄었습니다. 결국 전쟁에서 패배했습니다.','☠','assets/fiscal_collapse.jpg')}]],'assets/fiscal_mercantilism.jpg');
}
function fiscalEnding(success,title,tag,text,seal,image){
  el('sceneImage').style.display=''; let old=document.getElementById('warVisual'); if(old)old.remove();
  el('bigYear').textContent=success?'승리':'패배'; el('subtitle').textContent=success?'강력한 재정과 상비군을 갖춘 국가가 되었습니다.':'국가 운영에 실패했습니다.';
  showResult({
    title,seal,tag,success,text,
    image:image||(success?'assets/fiscal_victory.jpg':'assets/fiscal_collapse.jpg'),
    button:success?'다음 이야기: 영국 혁명 →':'재정 군사 국가 다시 도전',
    note:`최종 수치 · 금 ${stats.gold} / 인구 ${stats.pop} / 상비군 ${stats.army} / 왕권 ${stats.crown}`,

          alert('영국 혁명 챕터를 불러오지 못했습니다.');
        }
      } else {
        startFiscal();
      }
    }
  })
}
