<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>근대 유럽 역사 체험 게임</title>
<style>
:root{
  --bg:#f4ead0; --paper:#fffaf0; --ink:#34251d; --muted:#8a6a3f;
  --line:#c8a56c; --accent:#8f3430; --dark:#30281d;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#f7efd9,#efe0bd);color:var(--ink);
font-family:"Noto Serif KR","Malgun Gothic",serif;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:26px 24px 60px}
.header{text-align:center;margin-bottom:26px}
.eyebrow{letter-spacing:.18em;color:#8a6337;font-weight:700;font-size:.9rem}
h1{font-size:clamp(2.2rem,6vw,4.6rem);margin:10px 0;color:#33251c}
.big{font-size:clamp(3rem,10vw,7rem);color:#96332f;line-height:.9;margin:6px 0}
.subtitle{color:#7e5d37}
.card{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:8px;
padding:28px;box-shadow:0 12px 28px rgba(85,55,20,.08)}
.progress{display:flex;gap:12px;align-items:center;color:#7a5b35;font-weight:700;margin-bottom:22px}
.bar{height:8px;flex:1;background:#ddcfac;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#94332f,#ba782d);width:0;transition:.25s}
.scene{font-size:clamp(1.15rem,2.3vw,1.8rem);font-weight:800;line-height:1.65;margin:14px 0}
.prompt{border-left:4px solid #9c3434;background:#f4ead0;padding:14px 18px;line-height:1.6;margin:18px 0}
.choices{display:grid;gap:12px;margin-top:18px}
.choice{width:100%;text-align:left;padding:16px 18px;border:1px solid #b9955d;
background:#fffaf0;border-radius:8px;color:#30251e;font:inherit;cursor:pointer;line-height:1.55}
.choice:hover{background:#f5ead4;transform:translateY(-1px)}
.choice b{margin-right:8px;color:#7f2d2a}
.result{text-align:center;padding:24px 6px}
.result h2{font-size:clamp(2rem,4vw,3.2rem);color:#71302d}
.result p{line-height:1.75}
.btn{border:0;background:#73322d;color:white;padding:13px 20px;border-radius:7px;
font:inherit;font-weight:800;cursor:pointer;margin:8px}
.btn.secondary{background:#362b1f}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:#30291e;color:#f8e6bc;border:1px solid #8e6b37;border-radius:8px;
padding:14px;text-align:center;transition:.18s}
.stat .lab{font-size:.82rem;color:#d9c7a7}
.stat .val{font-size:1.7rem;font-weight:800;margin-top:4px}
.stat.up{background:#285c38!important;border-color:#6bb27a!important;transform:translateY(-2px)}
.stat.down{background:#6e2d2b!important;border-color:#c06a64!important;transform:translateY(-2px)}
.hidden{display:none!important}
.notice{font-size:.9rem;color:#8a6b46;margin-top:16px}
@media(max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="eyebrow" id="eyebrow">HISTORY · RELIGIOUS REFORMATION</div>
    <h1 id="gameTitle">1517년, 유럽이 흔들리다</h1>
    <div class="big" id="bigLabel">1517</div>
    <div class="subtitle" id="subtitle">선택에 따라 역사가 달라집니다.</div>
  </div>

  <section class="card">
    <div id="stats" class="stats hidden">
      <div class="stat" data-key="gold">💰<div class="lab">금</div><div id="gold" class="val">100</div></div>
      <div class="stat" data-key="pop">👥<div class="lab">인구</div><div id="pop" class="val">100</div></div>
      <div class="stat" data-key="army">⚔️<div class="lab">상비군</div><div id="army" class="val">30</div></div>
      <div class="stat" data-key="crown">👑<div class="lab">왕권</div><div id="crown" class="val">50</div></div>
    </div>
    <div class="progress"><span id="step">1 / 2</span><div class="bar"><div id="fill" class="fill"></div></div></div>
    <div id="content"></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const content=$('content');
let stats={gold:100,pop:100,army:30,crown:50};

function setHeader(eyebrow,title,big,subtitle){
  $('eyebrow').textContent=eyebrow;
  $('gameTitle').textContent=title;
  $('bigLabel').textContent=big;
  $('subtitle').textContent=subtitle;
}
function setProgress(n,total){
  $('step').textContent=`${n} / ${total}`;
  $('fill').style.width=`${n/total*100}%`;
}
function setStatsVisible(v){$('stats').classList.toggle('hidden',!v)}
function renderStats(){
  for(const k of ['gold','pop','army','crown']) $(k).textContent=stats[k];
}
function changeStats(delta){
  Object.entries(delta).forEach(([k,v])=>{
    stats[k]+=v;
    const box=document.querySelector(`[data-key="${k}"]`);
    box.classList.remove('up','down');
    void box.offsetWidth;
    box.classList.add(v>0?'up':'down');
    clearTimeout(box._timer);
    box._timer=setTimeout(()=>box.classList.remove('up','down'),900);
  });
  renderStats();
}
function choices(items){
  return `<div class="choices">${items.map(x=>
    `<button class="choice" data-act="${x.act}"><b>${x.label}</b>${x.text}</button>`
  ).join('')}</div>`;
}
function bind(actions){
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick=()=>actions[b.dataset.act]();
  });
}
function result(title,text,buttons){
  content.innerHTML=`<div class="result"><h2>${title}</h2><p>${text}</p>
    <div>${buttons.map((b,i)=>`<button class="btn ${i?'secondary':''}" data-act="${b.act}">${b.text}</button>`).join('')}</div></div>`;
  const acts={}; buttons.forEach(b=>acts[b.act]=b.fn); bind(acts);
}

/* ===== 1. 종교개혁 ===== */
function startReformation(){
  setStatsVisible(false);
  setHeader('HISTORY · RELIGIOUS REFORMATION','1517년, 유럽이 흔들리다','1517','선택에 따라 역사가 달라집니다.');
  reformationLuther();
}
function reformationLuther(){
  setProgress(1,2);
  content.innerHTML=`<div class="scene">교황청은 성 베드로 대성당 건축 재원을 마련하는 과정에서 면벌부 판매를 적극적으로 추진하고 있습니다!</div>
  <div class="prompt">“당신은 독일 비텐베르크 대학의 신학 교수 마르틴 루터입니다. 어떤 행동을 하시겠습니까?”</div>
  ${choices([
    {label:'①',text:'교황을 지지하여 힘을 보탠다.',act:'a'},
    {label:'②',text:'반박문을 작성하여 성경과 신앙을 중심으로 교회를 개혁하도록 요구한다.',act:'b'},
    {label:'③',text:'왕에게 교황을 체포하라고 요구서를 보낸다.',act:'c'},
    {label:'④',text:'모든 종교를 금지시키도록 한다.',act:'d'}])}`;
  bind({
    a:()=>result('엔딩','당신은 성난 민중들이 휘두른 몽둥이에 숨졌습니다. 모두 당신의 경멸스러운 이름을 기억할 것입니다.',[{text:'다시 선택하기',act:'r',fn:reformationLuther}]),
    b:()=>result('종교개혁의 불씨가 번지다!','독일 지역의 많은 성직자들과 교인들이 당신의 반박문에 화답했습니다! 결국 1555년 아우크스부르크 화의가 체결되어 루터파가 공식적으로 인정받았습니다.',[{text:'스위스로 이동하기 →',act:'n',fn:reformationCalvin}]),
    c:()=>result('반역죄 엔딩','왕이 당신의 요구서를 보고 반역죄로 체포하였습니다. 당신은 화형으로 생을 마감했습니다.',[{text:'다시 선택하기',act:'r',fn:reformationLuther}]),
    d:()=>result('엔딩','모든 민중이 당신의 주장을 미친 소리 취급했고, 당신은 대학 교수 자리에서 물러나야 했습니다.',[{text:'다시 선택하기',act:'r',fn:reformationLuther}])
  });
}
function reformationCalvin(){
  setProgress(2,2);
  setHeader('HISTORY · RELIGIOUS REFORMATION','1517년, 유럽이 흔들리다','1530s','종교개혁의 물결이 스위스로 이어집니다.');
  content.innerHTML=`<div class="scene">스위스에서도 종교 개혁의 물결이 계속됩니다.</div>
  <div class="prompt">“당신은 스위스에서 활동하는 종교개혁자 장 칼뱅입니다. 어떤 주장을 펼치시겠습니까?”</div>
  ${choices([
    {label:'①',text:'인간의 구원이 신에 의해 미리 정해져 있다는 예정설을 주장한다.',act:'a'},
    {label:'②',text:'무조건 교황의 면벌부 판매 조치에 따라야 한다고 주장한다.',act:'b'},
    {label:'③',text:'그리스 정교로 개종하여 새로운 크리스트교를 열어야 한다고 주장한다.',act:'c'}])}`;
  bind({
    a:()=>result('최종 엔딩 · 신교의 확산','당신의 주장이 힘을 얻고 프랑스·영국·네덜란드 등으로 퍼졌습니다. 유럽 곳곳에 신교가 확산되었습니다!<br><br>신교의 확산과 종교 갈등 속에서 30년 전쟁 등이 발생했고, 결국 베스트팔렌 조약으로 제후가 가톨릭·루터파·칼뱅파 중 하나를 선택하는 것이 허용되었습니다. 스위스와 네덜란드의 독립도 승인되었습니다.',[
      {text:'다음 챕터 · 재정 군사 국가 →',act:'next',fn:startFiscal}]),
    b:()=>result('엔딩','성난 민심이 당신을 위협합니다. 당신은 스위스에서 쫓겨나게 되었습니다.',[{text:'다시 선택하기',act:'r',fn:reformationCalvin}]),
    c:()=>result('엔딩','당신은 교황청에서 이단으로 지목되어 화형되었습니다.',[{text:'다시 선택하기',act:'r',fn:reformationCalvin}])
  });
}

/* ===== 2. 재정 군사 국가 ===== */
function fiscalHeader(){
  setHeader('HISTORY · FISCAL-MILITARY STATE','재정 군사 국가 체험하기','17세기','국가의 재정과 군사력을 직접 운영해 보세요.');
  setStatsVisible(true);
}
function startFiscal(){
  stats={gold:100,pop:100,army:30,crown:50}; renderStats(); fiscalHeader(); fiscal1();
}
function fiscal1(){
  setProgress(1,4);
  content.innerHTML=`<div class="scene">이벤트 발생! 주변 국가가 상비군을 확대하여 전쟁을 준비하고 있습니다!</div>
  <div class="prompt">어떤 선택을 하시겠습니까?</div>
  ${choices([{label:'A.',text:'상비군 확대',act:'a'},{label:'B.',text:'상비군 유지',act:'b'}])}`;
  bind({
    a:()=>{changeStats({gold:-30,army:+30});setTimeout(fiscal2,950)},
    b:()=>{changeStats({crown:-20,pop:-20});setTimeout(()=>result('국가 멸망','전쟁에서 패배했습니다. 왕권과 인구가 크게 감소했고 국가는 결국 멸망했습니다.',[{text:'재정 군사 국가 다시 도전',act:'r',fn:startFiscal}]),950)}
  });
}
function fiscal2(){
  setProgress(2,4);
  content.innerHTML=`<div class="scene">전쟁이 시작되었습니다. 당신의 상비군은 적의 공격을 막아냈습니다!<br><br>그러나 대규모 상비군을 유지하려면 지속적인 세금이 필요합니다!</div>
  <div class="prompt">어떻게 재정을 마련하시겠습니까?</div>
  ${choices([{label:'A.',text:'의회와 협력하여 세금 확보',act:'a'},{label:'B.',text:'왕이 직접 세금 징수',act:'b'},{label:'C.',text:'군대 축소',act:'c'}])}`;
  bind({
    a:fiscal3,
    b:()=>{changeStats({crown:+20});setTimeout(fiscal3,950)},
    c:()=>{changeStats({army:-30,crown:-50,pop:-50});setTimeout(()=>result('전쟁 패배 · 국가 멸망','군대를 축소한 틈을 타 적군이 다시 공격했습니다. 국가는 전쟁에서 패배하고 멸망했습니다.',[{text:'재정 군사 국가 다시 도전',act:'r',fn:startFiscal}]),950)}
  });
}
function fiscal3(){
  setProgress(3,4);
  content.innerHTML=`<div class="scene">국고에 세금이 없어 징수가 불가능합니다.</div>
  <div class="prompt">새로운 재정 기반을 마련하기 위해 어떤 경제 정책을 선택하시겠습니까?</div>
  ${choices([{label:'①',text:'중상주의 정책 채택',act:'a'},{label:'②',text:'중상주의 정책 채택하지 않음',act:'b'}])}`;
  bind({
    a:fiscal4,
    b:()=>{changeStats({gold:-50,army:-30});setTimeout(()=>result('국가 멸망','충분한 재정을 확보하지 못해 상비군을 유지할 수 없게 되었습니다. 국가는 전쟁에서 패배하고 멸망했습니다.',[{text:'재정 군사 국가 다시 도전',act:'r',fn:startFiscal}]),950)}
  });
}
function fiscal4(){
  setProgress(4,4);
  content.innerHTML=`<div class="scene">중상주의 정책을 채택하기로 했습니다.</div>
  <div class="prompt">국부를 늘리고 상비군을 유지하기 위해 어떤 정책을 시행하시겠습니까?</div>
  ${choices([
    {label:'⑴',text:'원료 수출 금지, 완성품 수입 금지 조치 내리기',act:'a'},
    {label:'⑵',text:'식민지보다는 국내에서 머무르기',act:'b'},
    {label:'⑶',text:'국내 공업 제품의 출국세 높이기',act:'c'}])}`;
  bind({
    a:()=>{changeStats({gold:+50,army:+30});setTimeout(()=>result('전쟁 승리!','전쟁에서 승리했습니다. 당신의 국가는 태평성대를 누리며 최고의 국가로 성장해나갔습니다!<div class="notice">최종 수치 · 금 '+stats.gold+' / 인구 '+stats.pop+' / 상비군 '+stats.army+' / 왕권 '+stats.crown+'</div>',[{text:'다음 이야기: 영국 혁명 →',act:'next',fn:startEnglishRevolution}]),950)},
    b:()=>{changeStats({gold:-50,army:-30});setTimeout(()=>result('전쟁 패배 · 국가 멸망','정책이 효과를 내지 못했습니다. 전쟁에서 패배하고 국가는 멸망했습니다.',[{text:'재정 군사 국가 다시 도전',act:'r',fn:startFiscal}]),950)},
    c:()=>{changeStats({gold:-50,army:-30});setTimeout(()=>result('전쟁 패배 · 국가 멸망','정책이 효과를 내지 못했습니다. 전쟁에서 패배하고 국가는 멸망했습니다.',[{text:'재정 군사 국가 다시 도전',act:'r',fn:startFiscal}]),950)}
  });
}

/* ===== 3. 영국 혁명 ===== */
function englishHeader(big='1628',sub='왕권과 의회의 충돌이 격화됩니다.'){
  setStatsVisible(false);
  setHeader('HISTORY · ENGLISH REVOLUTION','영국 혁명',big,sub);
}
function startEnglishRevolution(){ englishHeader(); english1(); }
function english1(){
  setProgress(1,6);
  content.innerHTML=`<div class="scene">찰스 1세가 절대주의를 추구하며 의회의 동의 없이 세금을 걷습니다.</div>
  <div class="prompt">왕에 대적하는 당신은 어떻게 대처하겠습니까?</div>
  ${choices([{label:'A.',text:'찰스 1세의 명령에 굴복한다.',act:'a'},{label:'B.',text:'찰스 1세에게 대항하기 위해 권리 청원을 제출한다.',act:'b'}])}`;
  bind({
    a:()=>result('엔딩','의회 의원들에게 집단 폭행을 당하며 생을 마감했습니다.',[{text:'영국 혁명 다시 시작',act:'r',fn:startEnglishRevolution}]),
    b:english2
  });
}
function english2(){
  setProgress(2,6);
  content.innerHTML=`<div class="scene">권리 청원의 내용을 어떻게 작성하시겠습니까?</div>
  ${choices([{label:'A.',text:'의회의 동의 없이 세금을 걷을 수 없습니다.',act:'a'},{label:'B.',text:'프랑스의 화폐를 우리나라의 화폐로 하시지요.',act:'b'},{label:'C.',text:'이만 왕위에서 물러나주시지요.',act:'c'}])}`;
  bind({
    a:english3,
    b:()=>result('엔딩','친프랑스 분자로 몰려 의원직이 박탈되었습니다.',[{text:'다시 도전',act:'r',fn:english2}]),
    c:()=>result('엔딩','반역자로 몰려 의원직이 박탈되었습니다.',[{text:'다시 도전',act:'r',fn:english2}])
  });
}
function english3(){
  setProgress(3,6);
  content.innerHTML=`<div class="scene">이벤트 발생! 찰스 1세가 의회를 해산하였습니다!</div>
  <div class="prompt">의회파와 왕당파, 둘 중 어느 편에 서겠습니까?</div>
  ${choices([{label:'A.',text:'나는 꿋꿋이 의회 편에서 의회의 권리를 되찾기 위해 힘쓰겠소.',act:'a'},{label:'B.',text:'아무래도 이제 국왕 폐하의 권력이 강해지는 것 같소. 나는 폐하 편에 서겠소.',act:'b'}])}`;
  bind({
    a:english4,
    b:()=>result('엔딩','이후 벌어진 내전에서 왕당파가 패배했고, 당신은 사형을 당했습니다.',[{text:'다시 도전',act:'r',fn:english3}])
  });
}
function english4(){
  setProgress(4,6);
  englishHeader('1660s','공화정과 왕정 복고를 거쳐 다시 갈림길에 섭니다.');
